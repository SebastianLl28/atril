[project]
name = "atril"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Alonso", email = "llamucasebas@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pillow>=13.0.0",
    "pymupdf>=1.28.2",
    "pypdf>=6.21.1",
    "weasyprint>=70.0",
]

[project.scripts]
atril = "atril:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
